# Locked Asset Universe for Asian Equities Sentiment Alpha (HKEX & KRX)
# Phase 1 Micro-Spec Section 1.4

exchanges:
  HKEX:
    timezone: "Asia/Hong_Kong"
    utc_offset_hours: 8
    currency: "HKD"
    warmup_days: 4
    active_days: 10
    total_trading_days: 14
    fetch_calendar_buffer_days: 28
    warmup_lead_hours: 18
    lunch_break_local: ["12:00", "13:00"]
    session_open_local: "09:30"
    session_close_local: "16:00"
    expected_bars_per_day: 7
    # Empirically verified against yfinance 60m & 30m (2026-11-18):
    # Yahoo grids HKEX 60m bars from 09:30; the 12:30 bar holds exact 13:00-13:30 afternoon open volume.
    # Also supports 13:00 if Yahoo ever shifts gridding.
    bar_schedule_local:
      "09:30": {actual_open: "09:30", close: "10:30", duration_min: 60, segment: "morning"}
      "10:30": {actual_open: "10:30", close: "11:30", duration_min: 60, segment: "morning"}
      "11:30": {actual_open: "11:30", close: "12:00", duration_min: 30, segment: "morning"}
      "12:30": {actual_open: "13:00", close: "13:30", duration_min: 30, segment: "afternoon"}
      "13:00": {actual_open: "13:00", close: "14:00", duration_min: 60, segment: "afternoon"}
      "13:30": {actual_open: "13:30", close: "14:30", duration_min: 60, segment: "afternoon"}
      "14:30": {actual_open: "14:30", close: "15:30", duration_min: 60, segment: "afternoon"}
      "15:00": {actual_open: "15:00", close: "16:00", duration_min: 60, segment: "afternoon"}
      "15:30": {actual_open: "15:30", close: "16:00", duration_min: 30, segment: "afternoon"}

  KRX:
    timezone: "Asia/Seoul"
    utc_offset_hours: 9
    currency: "KRW"
    warmup_days: 4
    active_days: 10
    total_trading_days: 14
    fetch_calendar_buffer_days: 28
    warmup_lead_hours: 18
    lunch_break_local: null
    session_open_local: "09:00"
    session_close_local: "15:00"
    expected_bars_per_day: 6
    # Empirically verified against yfinance 60m & 30m (2026-11-18):
    # Yahoo emits 6 hourly bars 09:00..14:00 KST (also supports 15:00->15:30 if emitted).
    bar_schedule_local:
      "09:00": {actual_open: "09:00", close: "10:00", duration_min: 60, segment: "continuous"}
      "10:00": {actual_open: "10:00", close: "11:00", duration_min: 60, segment: "continuous"}
      "11:00": {actual_open: "11:00", close: "12:00", duration_min: 60, segment: "continuous"}
      "12:00": {actual_open: "12:00", close: "13:00", duration_min: 60, segment: "continuous"}
      "13:00": {actual_open: "13:00", close: "14:00", duration_min: 60, segment: "continuous"}
      "14:00": {actual_open: "14:00", close: "15:00", duration_min: 60, segment: "continuous"}
      "15:00": {actual_open: "15:00", close: "15:30", duration_min: 30, segment: "continuous"}

